<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nooteo – Générateur de Flyer Commercial</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --navy: #0d2254;
  --blue: #1e3a8a;
  --sky: #3b82f6;
  --teal: #0d9488;
  --teal-light: #14b8a6;
  --gold: #f59e0b;
  --gold-dark: #d97706;
  --white: #ffffff;
  --off-white: #f8fafc;
  --border: #e2e8f0;
  --text: #1e293b;
  --muted: #64748b;

  /* A4 exact dimensions */
  --a4-w: 794px;
  --a4-h: 1123px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #dde3ef;
  color: var(--text);
  min-height: 100vh;
  padding: 24px;
}

/* ═══ LAYOUT ═══ */
.app {
  max-width: 1420px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 320px 1fr;
  grid-template-rows: auto 1fr;
  gap: 20px;
  align-items: start;
}

/* ── HEADER ── */
.app-header {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 60%, #2563eb 100%);
  color: white;
  padding: 20px 28px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 20px;
  box-shadow: 0 4px 20px rgba(13,34,84,0.3);
}
.app-header img { height: 48px; width: auto; filter: brightness(0) invert(1); }
.app-header h1 { font-family: 'Playfair Display', serif; font-size: 1.35rem; font-weight: 700; }
.app-header p  { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }
.badge {
  margin-left: auto;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 600;
  white-space: nowrap;
  letter-spacing: 0.5px;
}

/* ── CONTROLS ── */
.controls {
  background: white;
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 22px;
  position: sticky;
  top: 20px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.07);
}

.ctrl-section { margin-bottom: 20px; }
.ctrl-section:last-child { margin-bottom: 0; }

.ctrl-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.ctrl-label::before {
  content: '';
  display: inline-block;
  width: 3px; height: 13px;
  background: var(--teal);
  border-radius: 2px;
}

.lang-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lang-tab input { display: none; }
.lang-tab span {
  display: block; text-align: center;
  padding: 9px 8px;
  border-radius: 8px;
  border: 2px solid var(--border);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
  transition: all 0.2s;
  color: var(--muted);
}
.lang-tab input:checked + span {
  border-color: var(--blue);
  background: var(--blue);
  color: white;
  box-shadow: 0 2px 8px rgba(30,58,138,0.3);
}

.text-input {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  color: var(--text);
  transition: border-color 0.2s;
  background: var(--off-white);
  margin-bottom: 8px;
}
.text-input:last-child { margin-bottom: 0; }
.text-input:focus { outline: none; border-color: var(--blue); background: white; }

.activity-card {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  cursor: pointer;
  margin-bottom: 7px;
  transition: all 0.2s;
  background: var(--off-white);
}
.activity-card:last-child { margin-bottom: 0; }
.activity-card:hover { border-color: var(--sky); }
.activity-card.active { border-color: var(--blue); background: #eff6ff; }
.activity-card input { display: none; }
.act-icon { font-size: 1.3rem; }
.act-info { flex: 1; }
.act-name { font-weight: 600; font-size: 0.82rem; }
.act-sub  { font-size: 0.7rem; color: var(--muted); }
.act-check {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; color: white;
  transition: all 0.2s; flex-shrink: 0;
}
.activity-card.active .act-check { background: var(--blue); border-color: var(--blue); }

.divider { height: 1px; background: var(--border); margin: 18px 0; }

.btn-pdf {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, var(--teal), #059669);
  color: white; border: none; border-radius: 10px;
  font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.9rem;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(13,148,136,0.35);
  margin-top: 14px;
}
.btn-pdf:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(13,148,136,0.45); }

.btn-print {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 10px;
  background: white; color: var(--blue);
  border: 1.5px solid var(--blue);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.85rem;
  cursor: pointer; transition: all 0.2s; margin-top: 8px;
}
.btn-print:hover { background: #eff6ff; }

/* ── PREVIEW AREA ── */
.preview-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.preview-label {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: #8896b0;
  margin-bottom: 14px; align-self: flex-start;
}
.pages-container {
  display: flex; flex-direction: column; gap: 24px;
  align-items: center; width: 100%;
}
.page-indicator {
  font-size: 0.65rem; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: #8896b0;
  align-self: flex-start;
  margin-bottom: 6px;
}

/* ═══════════════════════════════════════════
   THE A4 PAGES — EXACT 794×1123px
═══════════════════════════════════════════ */
.a4-page {
  width: var(--a4-w);
  height: var(--a4-h);
  background: white;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  border-radius: 3px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  flex-shrink: 0;
}

/* ──── PAGE 1 ──── */

/* Header block — 220px */
.p1-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 65%, #1d4ed8 100%);
  padding: 28px 44px 24px;
  height: 220px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.p1-header::before {
  content: ''; position: absolute;
  top: -50px; right: -50px;
  width: 200px; height: 200px; border-radius: 50%;
  background: rgba(255,255,255,0.04);
}
.p1-header::after {
  content: ''; position: absolute;
  bottom: -70px; left: 28%;
  width: 260px; height: 260px; border-radius: 50%;
  background: rgba(59,130,246,0.13);
}
.p1-logo-row {
  display: flex; align-items: center; justify-content: space-between;
  position: relative; z-index: 1;
}
.p1-logo { height: 56px; width: auto; }
.p1-date { text-align: right; }
.p1-date .label { font-size: 0.65rem; color: rgba(255,255,255,0.55); letter-spacing: 0.5px; }
.p1-date .value { font-size: 0.78rem; color: rgba(255,255,255,0.9); font-weight: 600; margin-top: 2px; }

.p1-headline { position: relative; z-index: 1; }
.p1-tag {
  display: inline-block;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.28);
  color: rgba(255,255,255,0.9);
  padding: 3px 12px; border-radius: 20px;
  font-size: 0.65rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
  margin-bottom: 8px;
}
.p1-h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.7rem; color: white; line-height: 1.2; margin-bottom: 6px;
}
.p1-sub { font-size: 0.8rem; color: rgba(255,255,255,0.7); line-height: 1.5; }

/* Client band — 46px */
.p1-client {
  background: var(--gold);
  height: 46px;
  flex-shrink: 0;
  padding: 0 44px;
  display: flex; align-items: center; gap: 12px;
}
.p1-client .cl-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #92400e; white-space: nowrap; }
.p1-client .cl-pipe { color: var(--gold-dark); font-size: 1.1rem; }
.p1-client .cl-name { font-weight: 700; font-size: 0.92rem; color: #1c1917; }
.p1-client .cl-company { font-size: 0.82rem; color: #44403c; font-style: italic; margin-left: 2px; }

/* Body page 1 — remaining ~857px */
.p1-body {
  flex: 1;
  padding: 24px 44px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow: hidden;
}

/* Intro */
.p1-intro {
  font-size: 0.84rem; line-height: 1.65; color: #334155;
  border-left: 3px solid var(--teal);
  padding-left: 14px; flex-shrink: 0;
}

/* Section title */
.sec-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; color: var(--navy);
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px; flex-shrink: 0;
}
.sec-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to right, var(--border), transparent);
}

/* Activity cards */
.act-grid { display: grid; gap: 10px; }
.act-grid.c1 { grid-template-columns: 1fr; }
.act-grid.c2 { grid-template-columns: 1fr 1fr; }
.act-grid.c3 { grid-template-columns: 1fr 1fr 1fr; }

.act-card {
  background: var(--off-white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px 14px 20px;
  position: relative; overflow: hidden;
}
.act-card::before {
  content: ''; position: absolute;
  top: 0; left: 0; width: 4px; height: 100%;
  background: var(--teal);
}
.act-card .icon { font-size: 1.5rem; margin-bottom: 6px; display: block; }
.act-card h3 { font-weight: 700; font-size: 0.82rem; color: var(--navy); margin-bottom: 5px; }
.act-card p  { font-size: 0.74rem; color: var(--muted); line-height: 1.45; }
.act-benefit {
  margin-top: 8px; padding: 5px 8px;
  background: #dcfce7; border-radius: 5px;
  font-size: 0.7rem; color: #166534; font-weight: 600;
  line-height: 1.3;
}

/* ── PAGE 1 FOOTER STRIP ── */
.p1-footer-strip {
  height: 36px; flex-shrink: 0;
  background: var(--navy);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 44px;
}
.p1-footer-strip .pf-tagline { font-family: 'Playfair Display', serif; font-size: 0.82rem; color: white; }
.p1-footer-strip .pf-tagline span { color: var(--teal-light); }
.p1-footer-strip .pf-page { font-size: 0.65rem; color: rgba(255,255,255,0.45); letter-spacing: 0.5px; }

/* ──────────────────────────────
   PAGE 2
────────────────────────────── */

/* P2 header strip */
.p2-header-strip {
  height: 60px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--navy), var(--blue));
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 44px;
  position: relative; overflow: hidden;
}
.p2-header-strip::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(to right, var(--teal), var(--sky));
}
.p2-logo { height: 38px; width: auto; }
.p2-strip-title { font-family: 'Playfair Display', serif; font-size: 0.95rem; color: rgba(255,255,255,0.85); }
.p2-strip-badge {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 3px 12px; border-radius: 20px;
  font-size: 0.62rem; font-weight: 700; color: rgba(255,255,255,0.8);
  letter-spacing: 0.8px;
}

/* P2 body */
.p2-body {
  flex: 1;
  padding: 28px 44px 22px;
  display: flex; flex-direction: column; gap: 22px;
  overflow: hidden;
}

/* Why grid */
.why-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.why-item { display: flex; gap: 12px; align-items: flex-start; }
.why-icon {
  width: 34px; height: 34px; flex-shrink: 0;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--blue), var(--sky));
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem;
}
.why-item h4 { font-size: 0.82rem; font-weight: 700; color: var(--navy); margin-bottom: 3px; }
.why-item p  { font-size: 0.74rem; color: var(--muted); line-height: 1.4; }

/* Model row */
.model-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.model-card { border-radius: 12px; padding: 18px 20px; }
.model-card.free { background: var(--off-white); border: 1px solid var(--border); }
.model-card.premium { background: linear-gradient(135deg, var(--navy), var(--blue)); }
.model-card .plan-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; color: var(--teal); }
.model-card.premium .plan-label { color: var(--teal-light); }
.model-card h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
.model-card.free h3 { color: var(--navy); }
.model-card.premium h3 { color: white; }
.model-card p { font-size: 0.77rem; line-height: 1.5; }
.model-card.free p { color: var(--muted); }
.model-card.premium p { color: rgba(255,255,255,0.72); }

/* CTA box */
.cta-box {
  background: linear-gradient(135deg, #f0fdf4, #dcfce7);
  border: 1px solid #86efac;
  border-radius: 12px;
  padding: 16px 20px;
  display: flex; align-items: center; gap: 16px;
}
.cta-icon { font-size: 2rem; flex-shrink: 0; }
.cta-text h4 { font-size: 0.88rem; font-weight: 700; color: #14532d; margin-bottom: 4px; }
.cta-text p  { font-size: 0.75rem; color: #166534; line-height: 1.4; }
.cta-pill {
  margin-left: auto; flex-shrink: 0;
  background: var(--teal); color: white;
  padding: 8px 16px; border-radius: 20px;
  font-size: 0.75rem; font-weight: 700;
  white-space: nowrap;
}

/* Stats row */
.stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.stat-card {
  background: var(--off-white); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px;
  text-align: center;
}
.stat-card .stat-num { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: var(--blue); }
.stat-card .stat-label { font-size: 0.7rem; color: var(--muted); margin-top: 2px; line-height: 1.3; }

/* P2 Footer */
.p2-footer {
  background: var(--navy);
  padding: 0 44px;
  height: 80px;
  flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
}
.p2-footer-tagline { font-family: 'Playfair Display', serif; font-size: 1rem; color: white; }
.p2-footer-tagline span { color: var(--teal-light); }
.p2-footer-contact { text-align: right; }
.p2-footer-contact .fc-title { font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.45); margin-bottom: 4px; }
.p2-footer-contact a, .p2-footer-contact .fc-web { font-size: 0.78rem; color: var(--sky); font-weight: 600; display: block; text-decoration: none; }
.p2-footer-contact .fc-email { font-size: 0.75rem; color: rgba(255,255,255,0.65); }

/* ── RESPONSIVE ── */
@media (max-width: 1180px) {
  .app { grid-template-columns: 1fr; }
  .controls { position: static; }
  .a4-page { width: 100%; max-width: 794px; height: auto; min-height: var(--a4-h); }
}
@media (max-width: 860px) {
  body { padding: 12px; }
  .app { gap: 12px; }
  .a4-page { min-height: unset; }
  .p1-header { height: auto; padding: 20px 24px; }
  .p1-body, .p2-body { padding: 18px 24px; }
  .p1-client { padding: 0 24px; }
  .p1-footer-strip, .p2-header-strip { padding: 0 24px; }
  .p2-footer { padding: 0 24px; }
  .act-grid.c3 { grid-template-columns: 1fr 1fr; }
  .model-row, .why-grid { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: 1fr 1fr; }
}

/* Error */
.flyer-error {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex: 1; gap: 10px; color: #991b1b; font-weight: 600; padding: 40px; text-align: center;
}

/* PRINT */
@media print {
  body, .app, .preview-wrap { background: white !important; padding: 0 !important; }
  .app-header, .controls, .preview-label, .page-indicator { display: none !important; }
  .app { grid-template-columns: 1fr; }
  .pages-container { gap: 0; }
  .a4-page { box-shadow: none; width: 794px; height: 1123px; page-break-after: always; break-after: page; }
  .a4-page:last-child { page-break-after: auto; break-after: auto; }
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app">

const company = () => document.getElementById('companyName').value || '';
const isChk   = id => document.getElementById(id).checked;
const today   = l  => new Date().toLocaleDateString(l==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'long',year:'numeric'});

function toggleAct(key, el) {
  const chk = document.getElementById('chk' + key[0].toUpperCase() + key.slice(1));
  chk.checked = !chk.checked;
  el.classList.toggle('active', chk.checked);
  render();
}

// ─── RENDER ────────────────────────────────────
function render() {

  const showTour = isChk('chkTour'), showHotel = isChk('chkHotel'), showCar = isChk('chkCar');

  if (!showTour && !showHotel && !showCar) {
    pages.innerHTML = `<div class="a4-page"><div class="flyer-error"><div style="font-size:2.5rem">⚠️</div><p>${d.error}</p></div></div>`;
    return;

  if (showTour) acts.push(d.acts.tour);
  if (showHotel) acts.push(d.acts.hotel);
  if (showCar)  acts.push(d.acts.car);

    <div class="act-card">
      <span class="icon">${a.icon}</span>
      <h3>${a.name}</h3>
      <p>${a.desc}</p>
      <div class="act-benefit">${a.benefit}</div>

        </div>

        <div class="p1-h1">${d.h1_line1} ${d.h1_line2}<br>${d.h1_line3}</div>

    </div>

    <div class="p1-client">

      <span class="cl-name">${client()}${compStr}</span>

    <div class="p1-body">

        <div class="act-grid ${colCls}">${actCards}</div>

    </div>

    <div class="p1-footer-strip">
      <div class="pf-tagline">${d.p1_footer_tagline}</div>
      <div class="pf-page">${d.suite} &nbsp; ${d.page1of2}</div>
    </div>
  </div>`;

  // ── PAGE 2 ──
  const page2 = `
  <div class="a4-page" id="page2">
    <div class="p2-header-strip">
      <img class="p2-logo" src="${logoSrc}" alt="Nooteo">
      <div class="p2-strip-title">${d.tag}</div>

    </div>

    <div class="p2-body">

      <div>
        <div class="sec-title">${d.whySection}</div>
        <div class="why-grid">
          <div class="why-item">
            <div class="why-icon">⚡</div>
            <div><h4>${d.why1_title}</h4><p>${d.why1_desc}</p></div>
          </div>
          <div class="why-item">
            <div class="why-icon">🔍</div>
            <div><h4>${d.why2_title}</h4><p>${d.why2_desc}</p></div>
          </div>
          <div class="why-item">
            <div class="why-icon">🌍</div>
            <div><h4>${d.why3_title}</h4><p>${d.why3_desc}</p></div>
          </div>
          <div class="why-item">
            <div class="why-icon">📊</div>
            <div><h4>${d.why4_title}</h4><p>${d.why4_desc}</p></div>
          </div>
        </div>
      </div>

      <div>
        <div class="sec-title">${d.statsSection}</div>
        <div class="stats-row">
          <div class="stat-card"><div class="stat-num">${d.stat1}</div><div class="stat-label">${d.stat1l}</div></div>
          <div class="stat-card"><div class="stat-num">${d.stat2}</div><div class="stat-label">${d.stat2l}</div></div>
          <div class="stat-card"><div class="stat-num">${d.stat3}</div><div class="stat-label">${d.stat3l}</div></div>
        </div>
      </div>

      <div>
        <div class="sec-title">${d.modelSection}</div>
        <div class="model-row">
          <div class="model-card free">
            <div class="plan-label">${d.free_label}</div>
            <h3>${d.free_title}</h3>
            <p>${d.free_desc}</p>
          </div>
          <div class="model-card premium">

            <p>${d.premium_desc}</p>

      <div class="cta-box">

        <a class="fc-web" href="https://${d.footer_web}">${d.footer_web}</a>
        <div class="fc-email">${d.footer_email}</div>
      </div>
    </div>
  </div>`;

  pages.innerHTML = page1 + page2;
}

// ─── PDF — html2canvas + jsPDF, 1 image par page ──────────────
async function exportPDF() {
  const name = (client()+' '+company()).trim().replace(/[^a-zA-Z0-9-_]/g,'_');
  const filename = `Nooteo_Proposition_${name}_${new Date().toISOString().slice(0,10)}.pdf`;

  const btn = document.querySelector('.btn-pdf');
  const orig = btn.innerHTML;
  btn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg> Génération…';
  btn.style.opacity = '0.7';

  try {
    const { jsPDF } = window.jspdf;
    // A4 en points: 595.28 × 841.89 pt  |  en mm: 210 × 297
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const W_MM = 210, H_MM = 297;

    const canvasOpts = { scale: 2, useCORS: true, logging: false, allowTaint: true };

    // --- Page 1 ---
    const c1 = await html2canvas(document.getElementById('page1'), canvasOpts);
    pdf.addImage(c1.toDataURL('image/jpeg', 0.97), 'JPEG', 0, 0, W_MM, H_MM);

    // --- Page 2 ---
    pdf.addPage('a4', 'portrait');
    const c2 = await html2canvas(document.getElementById('page2'), canvasOpts);
    pdf.addImage(c2.toDataURL('image/jpeg', 0.97), 'JPEG', 0, 0, W_MM, H_MM);

    pdf.save(filename);
  } catch(e) {
    console.error(e);
    window.print(); // fallback
  }

  btn.innerHTML = orig;
  btn.style.opacity = '1';
}

render();
</script>
