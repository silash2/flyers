<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nooteo – Générateur de Flyer Commercial</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root {
  --navy: #0d2254;
  --blue: #1e3a8a;
  --sky: #3b82f6;
  --teal: #0d9488;
  --teal-light: #14b8a6;
  --gold: #f59e0b;
  --white: #ffffff;
  --off-white: #f8fafc;
  --border: #e2e8f0;
  --text: #1e293b;
  --muted: #64748b;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #eef2f7;
  color: var(--text);
  min-height: 100vh;
  padding: 20px;
}

/* ── LAYOUT ── */
.app {
  max-width: 1380px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 340px 1fr;
  grid-template-rows: auto 1fr;
  gap: 20px;
}

.app-header {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 60%, #2563eb 100%);
  color: white;
  padding: 22px 30px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 20px;
}

.app-header h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; }
.app-header p  { font-size: 0.85rem; opacity: 0.8; margin-top: 3px; }
.app-header .badge {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
  white-space: nowrap;
}

/* ── CONTROLS ── */
.controls {
  background: white;
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 24px;
  height: fit-content;
  position: sticky;
  top: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

.ctrl-section { margin-bottom: 22px; }
.ctrl-section:last-of-type { margin-bottom: 0; }

.ctrl-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ctrl-label::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 12px;
  background: var(--teal);
  border-radius: 2px;
}

.lang-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.lang-tab input { display: none; }
.lang-tab span {
  display: block;
  text-align: center;
  padding: 10px;
  border-radius: 8px;
  border: 2px solid var(--border);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9rem;
  transition: all 0.2s;
  color: var(--muted);
}
.lang-tab input:checked + span {
  border-color: var(--blue);
  background: var(--blue);
  color: white;
  box-shadow: 0 2px 8px rgba(30,58,138,0.3);
}

.text-input {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  color: var(--text);
  transition: border-color 0.2s;
  background: var(--off-white);
}
.text-input:focus { outline: none; border-color: var(--blue); background: white; }

.activity-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  cursor: pointer;
  margin-bottom: 8px;
  transition: all 0.2s;
  background: var(--off-white);
}
.activity-card:hover { border-color: var(--sky); }
.activity-card.active {
  border-color: var(--blue);
  background: #eff6ff;
}
.activity-card input { display: none; }
.act-icon { font-size: 1.5rem; }
.act-info { flex: 1; }
.act-name { font-weight: 600; font-size: 0.88rem; }
.act-sub  { font-size: 0.75rem; color: var(--muted); }
.act-check {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem;
  color: white;
  transition: all 0.2s;
}
.activity-card.active .act-check {
  background: var(--blue);
  border-color: var(--blue);
}

.divider { height: 1px; background: var(--border); margin: 20px 0; }

.btn-pdf {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--teal), #059669);
  color: white;
  border: none;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(13,148,136,0.35);
  margin-top: 16px;
}
.btn-pdf:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(13,148,136,0.45); }
.btn-pdf:active { transform: translateY(0); }
.btn-pdf svg { width: 18px; height: 18px; }

.btn-print {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 11px;
  background: white;
  color: var(--blue);
  border: 1.5px solid var(--blue);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
.btn-print:hover { background: #eff6ff; }

/* ── PREVIEW WRAPPER ── */
.preview-wrap {
  background: #d1d9e6;
  border-radius: 14px;
  padding: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 600px;
}
.preview-label {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #7a8a9f;
  margin-bottom: 16px;
  align-self: flex-start;
}

/* ── THE FLYER (A4 proportions) ── */
#flyer {
  width: 794px;
  min-height: 1123px;
  background: white;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  border-radius: 4px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Flyer Header */
.flyer-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 70%, #1d4ed8 100%);
  padding: 40px 50px 36px;
  position: relative;
  overflow: hidden;
}
.flyer-header::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 250px; height: 250px;
  border-radius: 50%;
  background: rgba(255,255,255,0.04);
}
.flyer-header::after {
  content: '';
  position: absolute;
  bottom: -80px; left: 30%;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: rgba(59,130,246,0.15);
}

.flyer-logo-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 30px;
  position: relative; z-index: 1;
}
.flyer-logo { height: 70px; width: auto; }
.flyer-date {
  font-size: 0.75rem;
  color: rgba(255,255,255,0.6);
  text-align: right;
}
.flyer-date strong { display: block; color: rgba(255,255,255,0.9); font-size: 0.85rem; }

.flyer-headline {
  position: relative; z-index: 1;
}
.flyer-headline .tag {
  display: inline-block;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: rgba(255,255,255,0.9);
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.flyer-headline h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem;
  color: white;
  line-height: 1.25;
  margin-bottom: 12px;
}
.flyer-headline .sub {
  font-size: 0.95rem;
  color: rgba(255,255,255,0.75);
  max-width: 520px;
  line-height: 1.6;
}

/* Client band */
.client-band {
  background: var(--gold);
  padding: 14px 50px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.client-band .label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #92400e;
}
.client-band .name {
  font-weight: 700;
  font-size: 1rem;
  color: #1c1917;
}
.client-band .pipe { color: #d97706; }

/* Flyer body */
.flyer-body {
  padding: 40px 50px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

/* Intro text */
.flyer-intro {
  font-size: 0.95rem;
  line-height: 1.7;
  color: #334155;
  border-left: 4px solid var(--teal);
  padding-left: 18px;
}

/* Section */
.flyer-section-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.25rem;
  color: var(--navy);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.flyer-section-title::after {
  content: '';
  flex: 1;
  height: 1.5px;
  background: linear-gradient(to right, var(--border), transparent);
}

/* Activity cards in flyer */
.activity-grid {
  display: grid;
  gap: 14px;
}
.activity-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.activity-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.activity-grid.cols-1 { grid-template-columns: 1fr; }

.act-flyer-card {
  background: var(--off-white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.act-flyer-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 100%;
  background: var(--teal);
}
.act-flyer-card .icon { font-size: 2rem; margin-bottom: 10px; }
.act-flyer-card h3 {
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--navy);
  margin-bottom: 8px;
}
.act-flyer-card p {
  font-size: 0.82rem;
  color: var(--muted);
  line-height: 1.5;
}
.act-flyer-card .benefit {
  margin-top: 10px;
  padding: 7px 10px;
  background: #dcfce7;
  border-radius: 6px;
  font-size: 0.78rem;
  color: #166534;
  font-weight: 600;
  display: flex;
  align-items: flex-start;
  gap: 6px;
}

/* Why Nooteo */
.why-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.why-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.why-icon {
  width: 36px; height: 36px; flex-shrink: 0;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--blue), var(--sky));
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
}
.why-item h4 { font-size: 0.85rem; font-weight: 700; color: var(--navy); margin-bottom: 3px; }
.why-item p  { font-size: 0.78rem; color: var(--muted); line-height: 1.4; }

/* Model */
.model-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.model-card {
  border-radius: 12px;
  padding: 20px;
  position: relative;
}
.model-card.free {
  background: var(--off-white);
  border: 1px solid var(--border);
}
.model-card.premium {
  background: linear-gradient(135deg, var(--navy), var(--blue));
  color: white;
}
.model-card .plan-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 6px;
  color: var(--teal);
}
.model-card.premium .plan-label { color: var(--teal-light); }
.model-card h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
.model-card.free h3 { color: var(--navy); }
.model-card p { font-size: 0.82rem; line-height: 1.5; }
.model-card.free p { color: var(--muted); }
.model-card.premium p { color: rgba(255,255,255,0.75); }

/* Flyer footer */
.flyer-footer {
  background: var(--navy);
  padding: 24px 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
}
.footer-tagline {
  color: white;
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
}
.footer-tagline span { color: var(--teal-light); }
.footer-contact {
  text-align: right;
  font-size: 0.78rem;
  color: rgba(255,255,255,0.6);
  line-height: 1.7;
}
.footer-contact strong { color: white; }
.footer-domain {
  color: var(--sky);
  font-weight: 600;
}

/* Error state */
.flyer-error {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 12px;
  color: #991b1b;
  font-weight: 600;
  padding: 40px;
  text-align: center;
}
.flyer-error .icon { font-size: 2.5rem; }

/* Responsive */
@media (max-width: 1100px) {
  #flyer { width: 100%; min-width: 0; }
  .app { grid-template-columns: 1fr; }
  .controls { position: static; }
}

/* PRINT STYLES */
@media print {
  body, .app, .preview-wrap { background: white !important; padding: 0 !important; }
  .app-header, .controls, .preview-label { display: none !important; }
  .app { grid-template-columns: 1fr; }
  .preview-wrap { padding: 0; background: white; }
  #flyer { box-shadow: none; width: 100%; }
}
</style>
</head>
<body>

<div class="app">
  <!-- TOP HEADER -->
  <div class="app-header">
    <div style="flex:1">
      <h1>Nooteo — Générateur de Flyer Commercial</h1>
      <p>Configurez votre flyer à la carte, visualisez en temps réel, exportez en PDF professionnel.</p>
    </div>
    <div class="badge">✨ Flyer + PDF</div>
  </div>

  <!-- CONTROL PANEL -->
  <div class="controls">
    <div class="ctrl-section">
      <div class="ctrl-label">Langue / Language</div>
      <div class="lang-tabs">
        <label class="lang-tab">
          <input type="radio" name="lang" value="fr" checked onchange="render()">
          <span>🇫🇷 Français</span>
        </label>
        <label class="lang-tab">
          <input type="radio" name="lang" value="en" onchange="render()">
          <span>🇬🇧 English</span>
        </label>
      </div>
    </div>

    <div class="ctrl-section">
      <div class="ctrl-label">Nom du Client</div>
      <input class="text-input" id="clientName" type="text" value="M. Jean Dupont" oninput="render()">
      <div style="margin-top:10px">
        <input class="text-input" id="companyName" type="text" value="Madagascar Voyages" oninput="render()" placeholder="Nom de l'entreprise">
      </div>
    </div>

    <div class="ctrl-section">
      <div class="ctrl-label">Activités du Prospect</div>
      <label class="activity-card active" id="lbl-tour" onclick="toggleAct('tour', this)">
        <input type="checkbox" id="chkTour" checked>
        <span class="act-icon">✈️</span>
        <div class="act-info">
          <div class="act-name">Tour Opérateur</div>
          <div class="act-sub">Circuits & Itinéraires</div>
        </div>
        <div class="act-check">✓</div>
      </label>
      <label class="activity-card active" id="lbl-hotel" onclick="toggleAct('hotel', this)">
        <input type="checkbox" id="chkHotel" checked>
        <span class="act-icon">🏨</span>
        <div class="act-info">
          <div class="act-name">Hébergement</div>
          <div class="act-sub">Lodge / Hôtel</div>
        </div>
        <div class="act-check">✓</div>
      </label>
      <label class="activity-card active" id="lbl-car" onclick="toggleAct('car', this)">
        <input type="checkbox" id="chkCar" checked>
        <span class="act-icon">🚗</span>
        <div class="act-info">
          <div class="act-name">Location de Voitures</div>
          <div class="act-sub">Logistique voyage</div>
        </div>
        <div class="act-check">✓</div>
      </label>
    </div>

    <div class="divider"></div>

    <div class="ctrl-section">
      <div class="ctrl-label">Exporter</div>
      <button class="btn-pdf" onclick="exportPDF()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/>
          <line x1="12" y1="18" x2="12" y2="12"/><polyline points="9,15 12,18 15,15"/>
        </svg>
        Générer le PDF
      </button>
      <button class="btn-print" onclick="window.print()">
        🖨️ Imprimer
      </button>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview-wrap">
    <div class="preview-label">📄 Aperçu du Flyer — A4</div>
    <div id="flyer"><!-- filled by JS --></div>
  </div>
</div>

// ─── HELPERS ───────────────────────────────────────────────────
function lang()    { return document.querySelector('input[name="lang"]:checked').value; }
function client()  { return document.getElementById('clientName').value  || '[Client]'; }
function company() { return document.getElementById('companyName').value || ''; }
function checked(id) { return document.getElementById(id).checked; }
function today(l)  {
  return new Date().toLocaleDateString(l === 'fr' ? 'fr-FR' : 'en-GB', { day:'numeric', month:'long', year:'numeric' });
}

function toggleAct(key, el) {
  const chk = document.getElementById('chk' + key.charAt(0).toUpperCase() + key.slice(1));
  chk.checked = !chk.checked;
  el.classList.toggle('active', chk.checked);
  render();
}

// ─── RENDER ────────────────────────────────────────────────────
function render() {
  const l  = lang();
  const d  = D[l];
  const showTour  = checked('chkTour');
  const showHotel = checked('chkHotel');
  const showCar   = checked('chkCar');
  const flyer = document.getElementById('flyer');

  if (!showTour && !showHotel && !showCar) {
    flyer.innerHTML = `<div class="flyer-error"><div class="icon">⚠️</div><p>${d.error}</p></div>`;
    return;
  }

  // Build activity cards
  const acts = [];
  if (showTour)  acts.push(d.acts.tour);
  if (showHotel) acts.push(d.acts.hotel);
  if (showCar)   acts.push(d.acts.car);

  const colClass = acts.length === 1 ? 'cols-1' : acts.length === 2 ? 'cols-2' : 'cols-3';

  const actCards = acts.map(a => `
    <div class="act-flyer-card">
      <div class="icon">${a.icon}</div>
      <h3>${a.name}</h3>
      <p>${a.desc}</p>
      <div class="benefit">${a.benefit}</div>
    </div>
  `).join('');

  const headlineLines = d.h1.split('\n').join('<br>');
  const companyStr = company() ? ` — <em>${company()}</em>` : '';

  flyer.innerHTML = `
    <!-- HEADER -->
    <div class="flyer-header">
      <div class="flyer-logo-row">
        <img class="flyer-logo" src="data:image/png;base64,${LOGO_B64}" alt="Nooteo Logo">
        <div class="flyer-date">
          <strong>${d.prepared}</strong>
          ${today(l)}
        </div>
      </div>
      <div class="flyer-headline">
        <div class="tag">${d.tag}</div>
        <h1>${headlineLines}</h1>
        <p class="sub">${d.sub}</p>
      </div>
    </div>

    <!-- CLIENT BAND -->
    <div class="client-band">
      <span class="label">${d.attn}</span>
      <span class="pipe">›</span>
      <span class="name">${client()}${companyStr}</span>
    </div>

    <!-- BODY -->
    <div class="flyer-body">

      <!-- Intro -->
      <p class="flyer-intro">${d.intro}</p>

      <!-- Activities -->
      <div>
        <div class="flyer-section-title">${d.actSection}</div>
        <div class="activity-grid ${colClass}">${actCards}</div>
      </div>

      <!-- Why Nooteo -->
      <div>
        <div class="flyer-section-title">${d.whySection}</div>
        <div class="why-grid">
          <div class="why-item">
            <div class="why-icon">⚡</div>
            <div><h4>${d.why1_title}</h4><p>${d.why1_desc}</p></div>
          </div>
          <div class="why-item">
            <div class="why-icon">🔍</div>
            <div><h4>${d.why2_title}</h4><p>${d.why2_desc}</p></div>
          </div>
          <div class="why-item">
            <div class="why-icon">🌍</div>
            <div><h4>${d.why3_title}</h4><p>${d.why3_desc}</p></div>
          </div>
          <div class="why-item">
            <div class="why-icon">📊</div>
            <div><h4>${d.why4_title}</h4><p>${d.why4_desc}</p></div>
          </div>
        </div>
      </div>

      <!-- Model -->
      <div>
        <div class="flyer-section-title">${d.modelSection}</div>
        <div class="model-row">
          <div class="model-card free">
            <div class="plan-label">${d.free_label}</div>
            <h3>${d.free_title}</h3>
            <p>${d.free_desc}</p>
          </div>
          <div class="model-card premium">
            <div class="plan-label">${d.premium_label}</div>
            <h3>${d.premium_title}</h3>
            <p>${d.premium_desc}</p>

      <div class="footer-tagline">${d.footer_tagline}</div>

        <strong>${d.footer_contact}</strong><br>

  `;

// ─── PDF EXPORT ────────────────────────────────────────────────
function exportPDF() {
  const l = lang();
  const name = (client() + ' ' + company()).trim().replace(/[^a-zA-Z0-9-_]/g, '_');
  const filename = `Nooteo_Proposition_${name}_${new Date().toISOString().slice(0,10)}.pdf`;

  const btn = document.querySelector('.btn-pdf');
  const origText = btn.innerHTML;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;animation:spin 0.8s linear infinite"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg> Génération...';
  btn.style.opacity = '0.75';

  const opt = {
    margin:       [0, 0, 0, 0],
    filename:     filename,
    image:        { type: 'jpeg', quality: 0.97 },
    html2canvas:  { scale: 2, useCORS: true, logging: false },
    jsPDF:        { unit: 'px', format: [794, 1123], orientation: 'portrait', hotfixes: ['px_scaling'] }
  };

  const el = document.getElementById('flyer');
  html2pdf().set(opt).from(el).save().then(() => {
    btn.innerHTML = origText;
    btn.style.opacity = '1';
  });
}

// Spinner animation
const style = document.createElement('style');
style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(style);

// Init
render();
