<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nooteo – Générateur de Flyer A4</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --navy:#0d2254; --blue:#1e3a8a; --sky:#3b82f6;
  --teal:#0d9488; --teal-light:#14b8a6;
  --gold:#f59e0b; --gold-dark:#d97706;
  --white:#fff; --off:#f8fafc;
  --border:#e2e8f0; --text:#1e293b; --muted:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#dde3ef;color:var(--text);min-height:100vh;padding:20px;}

/* ── LAYOUT ── */
.app{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;gap:18px;align-items:start;}

/* ── HEADER ── */
.app-header{
  grid-column:1/-1;
  background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 60%,#2563eb 100%);
  color:white;padding:16px 24px;border-radius:12px;
  display:flex;align-items:center;gap:16px;
  box-shadow:0 4px 20px rgba(13,34,84,.3);
}
.app-header img{height:44px;width:auto;}
.app-header h1{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;}
.app-header p{font-size:.75rem;opacity:.75;margin-top:2px;}
.badge{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:20px;font-size:.68rem;font-weight:600;white-space:nowrap;}

/* ── CONTROLS ── */
.controls{background:white;border-radius:12px;border:1px solid var(--border);padding:20px;position:sticky;top:20px;box-shadow:0 2px 16px rgba(0,0,0,.07);}
.ctrl-section{margin-bottom:18px;}
.ctrl-section:last-child{margin-bottom:0;}
.ctrl-label{font-size:.62rem;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:6px;}
.ctrl-label::before{content:'';display:inline-block;width:3px;height:12px;background:var(--teal);border-radius:2px;}

/* langue */
.lang-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.lang-tab input{display:none;}
.lang-tab span{display:block;text-align:center;padding:8px;border-radius:7px;border:2px solid var(--border);cursor:pointer;font-weight:600;font-size:.82rem;transition:all .2s;color:var(--muted);}
.lang-tab input:checked+span{border-color:var(--blue);background:var(--blue);color:white;box-shadow:0 2px 8px rgba(30,58,138,.3);}

/* inputs texte */
.text-input{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--text);transition:border-color .2s;background:var(--off);margin-bottom:7px;}
.text-input:last-child{margin-bottom:0;}
.text-input:focus{outline:none;border-color:var(--blue);background:white;}

/* logo input */
.logo-upload{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.logo-upload input[type=file]{display:none;}
.logo-btn{padding:7px 12px;background:var(--off);border:1.5px solid var(--border);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.78rem;cursor:pointer;transition:all .2s;color:var(--text);white-space:nowrap;}
.logo-btn:hover{border-color:var(--blue);color:var(--blue);}
.logo-preview{height:32px;width:auto;max-width:80px;object-fit:contain;display:none;border:1px solid var(--border);border-radius:5px;padding:2px;}

/* activity cards */
.activity-card{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;border:1.5px solid var(--border);cursor:pointer;margin-bottom:6px;transition:all .2s;background:var(--off);}
.activity-card:last-child{margin-bottom:0;}
.activity-card:hover{border-color:var(--sky);}
.activity-card.active{border-color:var(--blue);background:#eff6ff;}
.activity-card input{display:none;}
.act-icon{font-size:1.2rem;}
.act-info{flex:1;}
.act-name{font-weight:600;font-size:.78rem;}
.act-sub{font-size:.67rem;color:var(--muted);}
.act-check{width:17px;height:17px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.6rem;color:white;transition:all .2s;flex-shrink:0;}
.activity-card.active .act-check{background:var(--blue);border-color:var(--blue);}

.divider{height:1px;background:var(--border);margin:16px 0;}

/* boutons export */
.btn-pdf{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;background:linear-gradient(135deg,var(--teal),#059669);color:white;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(13,148,136,.35);margin-top:12px;}
.btn-pdf:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(13,148,136,.45);}
.btn-print{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px;background:white;color:var(--blue);border:1.5px solid var(--blue);border-radius:9px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.8rem;cursor:pointer;transition:all .2s;margin-top:7px;}
.btn-print:hover{background:#eff6ff;}

/* ── PREVIEW ── */
.preview-wrap{display:flex;flex-direction:column;align-items:center;gap:0;}
.preview-label{font-size:.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#8896b0;margin-bottom:12px;align-self:flex-start;}

/* ═══════════════════════════════════
   A4 PAGE — 794×1123px exact
═══════════════════════════════════ */
.a4{
  width:794px;height:1123px;
  background:white;
  box-shadow:0 8px 40px rgba(0,0,0,.18);
  border-radius:3px;
  overflow:hidden;
  display:flex;flex-direction:column;
  flex-shrink:0;
}

/* HEADER */
.hdr{
  background:linear-gradient(135deg,#0d2254 0%,#1e3a8a 60%,#1d4ed8 100%);
  height:200px;flex-shrink:0;
  padding:22px 40px 18px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.hdr::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.04);}
.hdr::after{content:'';position:absolute;bottom:-80px;left:30%;width:260px;height:260px;border-radius:50%;background:rgba(59,130,246,.12);}
.logo-row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.logo-img{height:56px;width:auto;}
.date-box{text-align:right;}
.date-box .lbl{font-size:.62rem;color:rgba(255,255,255,.55);letter-spacing:.5px;}
.date-box .val{font-size:.76rem;color:rgba(255,255,255,.9);font-weight:600;margin-top:2px;}
.headline{position:relative;z-index:1;}
.tag{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.9);padding:3px 12px;border-radius:20px;font-size:.62rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;}
.h1{font-family:'Playfair Display',serif;font-size:1.55rem;color:white;line-height:1.2;}
.sub{font-size:.77rem;color:rgba(255,255,255,.7);line-height:1.5;margin-top:5px;}

/* CLIENT BAND */
.client-band{background:var(--gold);height:42px;flex-shrink:0;padding:0 40px;display:flex;align-items:center;gap:10px;}
.cl-lbl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#92400e;white-space:nowrap;}
.cl-pipe{color:#d97706;font-size:1.1rem;}
.cl-name{font-weight:700;font-size:.88rem;color:#1c1917;}
.cl-co{font-size:.8rem;color:#44403c;font-style:italic;margin-left:2px;}

/* BODY */
.body{flex:1;padding:18px 40px 16px;display:flex;flex-direction:column;gap:14px;overflow:hidden;}
.intro{font-size:.82rem;line-height:1.6;color:#334155;border-left:3px solid var(--teal);padding-left:12px;flex-shrink:0;}
.sec{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--navy);display:flex;align-items:center;gap:8px;flex-shrink:0;margin-bottom:8px;}
.sec::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent);}

/* activity cards flyer */
.act-grid{display:grid;gap:8px;flex-shrink:0;}
.c1{grid-template-columns:1fr;}
.c2{grid-template-columns:1fr 1fr;}
.c3{grid-template-columns:1fr 1fr 1fr;}
.acard{background:var(--off);border:1px solid var(--border);border-radius:9px;padding:11px 14px 11px 18px;position:relative;overflow:hidden;}
.acard::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--teal);}
.acard .icon{font-size:1.35rem;margin-bottom:4px;display:block;}
.acard h3{font-weight:700;font-size:.78rem;color:var(--navy);margin-bottom:3px;}
.acard p{font-size:.71rem;color:var(--muted);line-height:1.4;}
.benefit{margin-top:5px;padding:4px 7px;background:#dcfce7;border-radius:4px;font-size:.68rem;color:#166534;font-weight:600;line-height:1.3;}

/* two col */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex-shrink:0;}
.why-item{display:flex;gap:10px;align-items:flex-start;}
.why-icon{width:30px;height:30px;flex-shrink:0;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--sky));display:flex;align-items:center;justify-content:center;font-size:.85rem;}
.why-item h4{font-size:.76rem;font-weight:700;color:var(--navy);margin-bottom:2px;}
.why-item p{font-size:.7rem;color:var(--muted);line-height:1.35;}
.model-free{background:var(--off);border:1px solid var(--border);border-radius:10px;padding:13px 16px;}
.model-prem{background:linear-gradient(135deg,var(--navy),var(--blue));border-radius:10px;padding:13px 16px;}
.plan-lbl{font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;color:var(--teal);}
.model-prem .plan-lbl{color:var(--teal-light);}
.model-free h3{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:4px;}
.model-prem h3{font-size:1rem;font-weight:700;color:white;margin-bottom:4px;}
.model-free p{font-size:.73rem;color:var(--muted);line-height:1.45;}
.model-prem p{font-size:.73rem;color:rgba(255,255,255,.72);line-height:1.45;}

/* stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-shrink:0;}
.stat{background:var(--off);border:1px solid var(--border);border-radius:9px;padding:11px;text-align:center;}
.stat .num{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;color:var(--blue);}
.stat .lbl{font-size:.67rem;color:var(--muted);margin-top:1px;line-height:1.3;}

/* CTA */
.cta{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #86efac;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.cta-icon{font-size:1.8rem;flex-shrink:0;}
.cta-text h4{font-size:.82rem;font-weight:700;color:#14532d;margin-bottom:3px;}
.cta-text p{font-size:.71rem;color:#166534;line-height:1.35;}
.cta-pill{margin-left:auto;flex-shrink:0;background:var(--teal);color:white;padding:7px 14px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;}

/* FOOTER */
.footer{background:var(--navy);height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 40px;}
.footer-tag{font-family:'Playfair Display',serif;font-size:.85rem;color:white;}
.footer-tag span{color:var(--teal-light);}
.footer-contact{text-align:right;}
.footer-contact .fc-title{font-size:.6rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:1px;}
.footer-contact a{font-size:.72rem;color:var(--sky);font-weight:600;text-decoration:none;}

/* error */
.flyer-error{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;color:#991b1b;font-weight:600;padding:40px;text-align:center;}

/* PRINT */
@media print{
  body,html{background:white!important;padding:0!important;}
  .app-header,.controls,.preview-label{display:none!important;}
  .app{grid-template-columns:1fr;}
  .a4{box-shadow:none;width:794px;height:1123px;}
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER APP -->
  <div class="app-header">
    <img id="headerLogo" src="logo.png" alt="Nooteo" onerror="this.style.display='none'">
    <div>
      <h1>Nooteo — Générateur de Flyer Commercial</h1>
      <p>Format A4 · Personnalisable · Export PDF</p>
    </div>
    <div class="badge">📄 1 page A4</div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <!-- Langue -->
    <div class="ctrl-section">
      <div class="ctrl-label">Langue</div>
      <div class="lang-tabs">
        <label class="lang-tab">
          <input type="radio" name="lang" value="fr" checked onchange="render()">
          <span>🇫🇷 Français</span>
        </label>
        <label class="lang-tab">
          <input type="radio" name="lang" value="en" onchange="render()">
          <span>🇬🇧 English</span>
        </label>
      </div>
    </div>

    <!-- Logo -->
    <div class="ctrl-section">
      <div class="ctrl-label">Logo</div>
      <div class="logo-upload">
        <label class="logo-btn" for="logoFile">📁 Choisir un logo</label>
        <input type="file" id="logoFile" accept="image/*" onchange="loadLogo(this)">
        <img id="logoPreview" class="logo-preview" alt="preview">
        <span id="logoStatus" style="font-size:.72rem;color:var(--muted);">logo.png par défaut</span>
      </div>
    </div>

    <!-- Client -->
    <div class="ctrl-section">
      <div class="ctrl-label">Client</div>
      <input class="text-input" id="clientName" type="text" value="M. Jean Dupont" placeholder="Nom du client" oninput="render()">
      <input class="text-input" id="companyName" type="text" value="Madagascar Voyages" placeholder="Entreprise (optionnel)" oninput="render()">
    </div>

    <!-- Activités -->
    <div class="ctrl-section">
      <div class="ctrl-label">Activités</div>
      <label class="activity-card active" id="lbl-tour" onclick="toggleAct('Tour',this)">
        <input type="checkbox" id="chkTour" checked>
        <span class="act-icon">✈️</span>
        <div class="act-info"><div class="act-name">Tour Opérateur</div><div class="act-sub">Circuits &amp; Itinéraires</div></div>
        <div class="act-check">✓</div>
      </label>
      <label class="activity-card active" id="lbl-Hotel" onclick="toggleAct('Hotel',this)">
        <input type="checkbox" id="chkHotel" checked>
        <span class="act-icon">🏨</span>
        <div class="act-info"><div class="act-name">Hébergement</div><div class="act-sub">Lodge / Hôtel</div></div>
        <div class="act-check">✓</div>
      </label>
      <label class="activity-card active" id="lbl-Car" onclick="toggleAct('Car',this)">
        <input type="checkbox" id="chkCar" checked>
        <span class="act-icon">🚗</span>
        <div class="act-info"><div class="act-name">Location de Voitures</div><div class="act-sub">Logistique voyage</div></div>
        <div class="act-check">✓</div>
      </label>
    </div>

    <div class="divider"></div>

    <!-- Export -->
    <div class="ctrl-section">
      <div class="ctrl-label">Exporter</div>
      <button class="btn-pdf" onclick="exportPDF()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/>
          <line x1="12" y1="18" x2="12" y2="12"/><polyline points="9,15 12,18 15,15"/>
        </svg>
        Générer le PDF
      </button>
      <button class="btn-print" onclick="window.print()">🖨️ Imprimer</button>
    </div>

  </div><!-- /controls -->

  <!-- PREVIEW -->
  <div class="preview-wrap">
    <div class="preview-label">📄 Aperçu — Format A4</div>
    <div id="flyer"></div>
  </div>

</div><!-- /app -->

/* ─────────────── ÉTAT ─────────────── */
let logoSrc = 'logo.png'; // chemin par défaut

/* ─────────────── LOGO ─────────────── */
function loadLogo(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    logoSrc = e.target.result;
    document.getElementById('logoPreview').src = logoSrc;
    document.getElementById('logoPreview').style.display = 'block';
    document.getElementById('logoStatus').textContent = file.name;
    document.getElementById('headerLogo').src = logoSrc;
    render();
  };
  reader.readAsDataURL(file);
}

/* ─────────────── HELPERS ─────────────── */
const lang    = () => document.querySelector('input[name="lang"]:checked').value;
const client  = () => document.getElementById('clientName').value  || '[Client]';
const company = () => document.getElementById('companyName').value || '';
const isChk   = id => document.getElementById('chk'+id).checked;
const today   = l  => new Date().toLocaleDateString(l==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'long',year:'numeric'});

function toggleAct(key, el){
  const chk = document.getElementById('chk'+key);
  chk.checked = !chk.checked;
  el.classList.toggle('active', chk.checked);
  render();
}

/* ─────────────── RENDER ─────────────── */
function render(){
  const l = lang(), d = D[l];
  const showTour  = isChk('Tour');
  const showHotel = isChk('Hotel');
  const showCar   = isChk('Car');
  const container = document.getElementById('flyer');

  if(!showTour && !showHotel && !showCar){
    container.innerHTML = `<div class="a4"><div class="flyer-error"><div style="font-size:2.5rem">⚠️</div><p>${d.error}</p></div></div>`;
    return;
  }

  const acts = [];
  if(showTour)  acts.push(d.acts.Tour);
  if(showHotel) acts.push(d.acts.Hotel);
  if(showCar)   acts.push(d.acts.Car);

  const colCls = acts.length===1?'c1':acts.length===2?'c2':'c3';
  const actCards = acts.map(a=>`
    <div class="acard">
      <span class="icon">${a.icon}</span>
      <h3>${a.name}</h3>
      <p>${a.desc}</p>
      <div class="benefit">${a.benefit}</div>
    </div>`).join('');

  const coStr = company()?` <span class="cl-co">— ${company()}</span>`:'';

  container.innerHTML = `
  <div class="a4" id="page1">
    <div class="hdr">
      <div class="logo-row">
        <img class="logo-img" src="${logoSrc}" alt="Nooteo" onerror="this.style.opacity='.3'">
        <div class="date-box">
          <div class="lbl">${d.prepared}</div>
          <div class="val">${today(l)}</div>
        </div>
      </div>
      <div class="headline">
        <div class="tag">${d.tag}</div>
        <div class="h1">${d.h1}</div>
        <div class="sub">${d.sub}</div>
      </div>
    </div>

    <div class="client-band">
      <span class="cl-lbl">${d.attn}</span>
      <span class="cl-pipe">›</span>
      <span class="cl-name">${client()}${coStr}</span>
    </div>

    <div class="body">
      <p class="intro">${d.intro}</p>

      <div>
        <div class="sec">${d.actSection}</div>
        <div class="act-grid ${colCls}">${actCards}</div>
      </div>

      <div class="two-col">
        <div>
          <div class="sec">${d.whySection}</div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <div class="why-item"><div class="why-icon">⚡</div><div><h4>${d.why1_t}</h4><p>${d.why1_d}</p></div></div>
            <div class="why-item"><div class="why-icon">🔍</div><div><h4>${d.why2_t}</h4><p>${d.why2_d}</p></div></div>
            <div class="why-item"><div class="why-icon">🌍</div><div><h4>${d.why3_t}</h4><p>${d.why3_d}</p></div></div>
            <div class="why-item"><div class="why-icon">📊</div><div><h4>${d.why4_t}</h4><p>${d.why4_d}</p></div></div>
          </div>
        </div>
        <div>
          <div class="sec">${d.modelSection}</div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <div class="model-free">
              <div class="plan-lbl">${d.free_label}</div>
              <h3>${d.free_title}</h3>
              <p>${d.free_desc}</p>
            </div>
            <div class="model-prem">
              <div class="plan-lbl">${d.prem_label}</div>
              <h3>${d.prem_title}</h3>
              <p>${d.prem_desc}</p>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="sec">${d.statsSection}</div>
        <div class="stats-row">
          <div class="stat"><div class="num">${d.stat1}</div><div class="lbl">${d.stat1l}</div></div>
          <div class="stat"><div class="num">${d.stat2}</div><div class="lbl">${d.stat2l}</div></div>
          <div class="stat"><div class="num">${d.stat3}</div><div class="lbl">${d.stat3l}</div></div>
        </div>
      </div>

      <div class="cta">
        <div class="cta-icon">🚀</div>
        <div class="cta-text">
          <h4>${d.ctaTitle}</h4>
          <p>${d.ctaDesc}</p>
        </div>
        <div class="cta-pill">${d.ctaAction}</div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-tag">${d.footer_tag}</div>
      <div class="footer-contact">
        <div class="fc-title">${d.contact}</div>
        <a href="mailto:${d.email}">${d.email}</a>
      </div>
    </div>
  </div>`;
}

/* ─────────────── EXPORT PDF ─────────────── */
async function exportPDF(){
  const btn = document.querySelector('.btn-pdf');
  const orig = btn.innerHTML;
  btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin .8s linear infinite"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg> Génération…';
  btn.style.opacity='.7';
  try {
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const c = await html2canvas(document.getElementById('page1'),{scale:2,useCORS:true,logging:false});
    pdf.addImage(c.toDataURL('image/jpeg',.97),'JPEG',0,0,210,297);
    const name = (client()+' '+company()).trim().replace(/[^a-zA-Z0-9\-_]/g,'_');
    pdf.save(`Nooteo_Proposition_${name}.pdf`);
  } catch(e){ window.print(); }
  btn.innerHTML = orig;
  btn.style.opacity='1';
}

/* ─────────────── INIT ─────────────── */
render();
</script>
